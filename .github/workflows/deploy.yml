# main 에 올릴 때마다 테스트 → 빌드 → GitHub Pages 에 배포
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /egg_Edit/
          # 공개용(publishable) 값이라 저장소에 있어도 괜찮다. 관리자(secret) 키는 절대 여기에 넣지 않는다.
          VITE_SUPABASE_URL: https://fowgxyiewidbpuinjmlb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_FnSEwxtYfIOgJaRy5Bkgiw_N3X15gfs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
